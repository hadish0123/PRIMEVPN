name: Publish Stable PRIMEVPN v1.5.0

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-stable-v1.5.0.yml"
  workflow_run:
    workflows:
      - "Build Stable PRIMEVPN v1.5.0 Draft"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Resolve release source
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          TARGET="$(gh release view v1.5.0 \
            --repo "$GITHUB_REPOSITORY" \
            --json targetCommitish \
            --jq .targetCommitish)"
          test -n "$TARGET"
          echo "sha=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0

      - name: Validate release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          VERSION="$(tr -d '[:space:]' < internal/config/version)"
          TAG="v$VERSION"
          SOURCE_HEAD="$(git rev-parse HEAD)"

          test "$TAG" = "v1.5.0"

          mkdir -p release-check
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "primevpn-linux-amd64.tar.gz" \
            --pattern "primevpn-linux-amd64.tar.gz.sha256" \
            --dir release-check

          bash packaging/release/verify-release-archive.sh \
            release-check/primevpn-linux-amd64.tar.gz \
            release-check/primevpn-linux-amd64.tar.gz.sha256 \
            "$VERSION" \
            "$SOURCE_HEAD"

      - name: Finalize stable release metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          VERSION="$(tr -d '[:space:]' < internal/config/version)"
          TAG="v$VERSION"

          printf '%s\n' \
            '# PRIMEVPN v1.5.0' \
            '' \
            'Stable Linux amd64 release from the canonical `hadish0123/PRIMEVPN` repository.' \
            '' \
            '### Highlights' \
            '- Runtime-backed multi-profile inbounds.' \
            '- Independent per-profile transport, TLS/REALITY, header and Sockopt controls.' \
            '- Runtime listener collision validation.' \
            '- Start-after-first-use client expiration synchronization.' \
            '- Canonical lowercase Linux install/runtime layout.' \
            '- Verified release manifest, runtime provenance, and SHA-256 checksums.' \
            '' \
            '### Runtime provenance' \
            'The PRIMEVPN custom Xray binary was recovered from the checksum-verified historical v1.0.0 PRIMEVPN release and mirrored into this repository. MTProto and geodata assets are pinned to explicit public release versions and SHA-256 checksums in `RUNTIME_SOURCES`.' \
            '' \
            'The published archive was independently verified and passed a fresh non-interactive Ubuntu 24.04 installation smoke test.' \
            > /tmp/release-notes.md

          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file /tmp/release-notes.md

          IS_DRAFT="$(gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft \
            --jq .isDraft)"

          if [[ "$IS_DRAFT" == "true" ]]; then
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft=false
          fi

          test "$(gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft \
            --jq .isDraft)" = "false"

          echo "STABLE_RELEASE_PUBLISHED=$TAG"

      - name: Fresh Ubuntu install smoke test
        shell: bash
        run: |
          set -Eeuo pipefail
          VERSION="$(tr -d '[:space:]' < internal/config/version)"
          bash deploy/test/smoke-noninteractive.sh "v$VERSION"
