name: Docs CI

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-ci.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs-ci.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: docs

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Reject corrupted Radix namespace
        run: |
          if grep -R --line-number --fixed-strings '@radiprimevpn/' package.json pnpm-lock.yaml content app components lib 2>/dev/null; then
            echo "ERROR: corrupted @radiprimevpn namespace detected; use @radix-ui." >&2
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
