name: Release Install Smoke Tests

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to install (for example v1.5.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  linux-amd64-install:
    name: Fresh Ubuntu install (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      XUI_SMOKE_VERSION: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Checkout current installer
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify published release install
        run: bash deploy/test/smoke-noninteractive.sh "$XUI_SMOKE_VERSION"
