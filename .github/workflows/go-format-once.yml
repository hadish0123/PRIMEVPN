name: One-time Go Formatting

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/go-format-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.8"
          cache: true

      - name: Install formatters
        run: |
          go install mvdan.cc/gofumpt@latest
          go install golang.org/x/tools/cmd/goimports@latest

      - name: Format touched Go files
        shell: bash
        run: |
          set -Eeuo pipefail
          files=(
            internal/web/service/inbound_disable.go
            internal/web/web.go
            internal/frontmux/manager.go
            internal/web/service/xray_frontmux_runtime.go
            internal/web/service/client_bulk.go
            internal/web/service/tgbot/tgbot.go
            internal/web/controller/custom_panel_contract_test.go
            internal/web/service/client_rbac.go
            internal/web/job/check_client_ip_job_integration_test.go
            internal/web/service/client_visibility.go
            internal/web/service/client_inbound_billing.go
            internal/web/service/server.go
            internal/sub/controller.go
            internal/util/link/outbound.go
            internal/web/service/inbound_migration.go
          )
          gofumpt -w "${files[@]}"
          goimports -w -local github.com/mhsanaei/PRIMEVPN "${files[@]}"
          git diff --check

      - name: Compile and test
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p internal/web/dist
          touch internal/web/dist/.gitkeep
          go test ./internal/frontmux ./internal/sub ./internal/util/link ./internal/web/... ./internal/xray/...

      - name: Commit formatting
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            internal/web/service/inbound_disable.go \
            internal/web/web.go \
            internal/frontmux/manager.go \
            internal/web/service/xray_frontmux_runtime.go \
            internal/web/service/client_bulk.go \
            internal/web/service/tgbot/tgbot.go \
            internal/web/controller/custom_panel_contract_test.go \
            internal/web/service/client_rbac.go \
            internal/web/job/check_client_ip_job_integration_test.go \
            internal/web/service/client_visibility.go \
            internal/web/service/client_inbound_billing.go \
            internal/web/service/server.go \
            internal/sub/controller.go \
            internal/util/link/outbound.go \
            internal/web/service/inbound_migration.go
          if git diff --cached --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git commit -m "style: format Go lint cleanup"
          git pull --rebase origin main
          git push origin HEAD:main
