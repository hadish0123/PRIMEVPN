name: Release PRIMEVPN

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to validate (for example v1.5.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate linux-amd64 release asset
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0

      - name: Validate source version and tag
        shell: bash
        run: |
          set -Eeuo pipefail
          VERSION="$(tr -d '[:space:]' < internal/config/version)"
          test "$RELEASE_TAG" = "v$VERSION"
          echo "SOURCE_HEAD=$(git rev-parse HEAD)"

      - name: Download published release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p release-check
          gh release download "$RELEASE_TAG"             --repo "${GITHUB_REPOSITORY}"             --pattern "primevpn-linux-amd64.tar.gz"             --pattern "primevpn-linux-amd64.tar.gz.sha256"             --dir release-check
          test -s release-check/primevpn-linux-amd64.tar.gz
          test -s release-check/primevpn-linux-amd64.tar.gz.sha256

      - name: Verify release archive contract
        shell: bash
        run: |
          set -Eeuo pipefail
          VERSION="$(tr -d '[:space:]' < internal/config/version)"
          SOURCE_HEAD="$(git rev-parse HEAD)"
          bash packaging/release/verify-release-archive.sh             release-check/primevpn-linux-amd64.tar.gz             release-check/primevpn-linux-amd64.tar.gz.sha256             "$VERSION"             "$SOURCE_HEAD"
