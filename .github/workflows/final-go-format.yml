name: Final Go Formatting

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/final-go-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.8"
          cache: true
      - run: |
          go install mvdan.cc/gofumpt@latest
          go install golang.org/x/tools/cmd/goimports@latest
      - shell: bash
        run: |
          set -Eeuo pipefail
          files=(
            internal/database/db.go
            internal/web/controller/custom_panel.go
            internal/web/controller/inbound.go
          )
          gofumpt -w "${files[@]}"
          goimports -w -local github.com/mhsanaei/PRIMEVPN "${files[@]}"
          git diff --check
      - shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/database/db.go internal/web/controller/custom_panel.go internal/web/controller/inbound.go
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: finish Go formatting"
          git pull --rebase origin main
          git push origin HEAD:main
