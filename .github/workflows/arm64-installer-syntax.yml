name: ARM64 installer syntax

on:
  push:
    paths:
      - "install.sh"
      - "install-arm64-docker.sh"
      - "ARM64-INSTALL.md"
      - ".github/workflows/arm64-installer-syntax.yml"
  pull_request:
    paths:
      - "install-arm64-docker.sh"
      - ".github/workflows/arm64-installer-syntax.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bash-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate main installer syntax
        run: bash -n install.sh
      - name: Validate ARM64 installer syntax
        run: bash -n install-arm64-docker.sh
      - name: Check whitespace errors
        run: git diff --check
